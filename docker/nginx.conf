server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    absolute_redirect off;

    root /usr/share/nginx/html;
    index index.html;

    access_log /dev/stdout;
    error_log /dev/stderr warn;

    location = /rss { return 301 /rss.xml; }
    location = /rss/ { return 301 /rss.xml; }
    location = /posts/rss { return 301 /rss.xml; }
    location = /posts/rss/ { return 301 /rss.xml; }
    location = /posts/rss.xml { return 301 /rss.xml; }
    location = /notes/rss { return 301 /rss.xml; }
    location = /notes/rss/ { return 301 /rss.xml; }
    location = /notes/rss.xml { return 301 /rss.xml; }
    location = /photos/rss { return 301 /rss.xml; }
    location = /photos/rss/ { return 301 /rss.xml; }
    location = /photos/rss.xml { return 301 /rss.xml; }
    location = /races/rss { return 301 /rss.xml; }
    location = /races/rss/ { return 301 /rss.xml; }
    location = /races/rss.xml { return 301 /rss.xml; }
    location = /newsletter.xml { return 301 /rss.xml; }
    location = /feed.xml { return 301 /rss.xml; }
    location = /notes { return 301 /posts/; }
    location = /notes/ { return 301 /posts/; }
    location = /photos { return 301 /about/; }
    location = /photos/ { return 301 /about/; }
    location = /slash { return 301 /; }
    location = /slash/ { return 301 /; }
    location = /newsletter { return 302 https://buttondown.com/dominikhofer; }
    location = /newsletter/ { return 302 https://buttondown.com/dominikhofer; }

    # SocialSpec (socialspec.org): readable from any origin, including
    # browser preflights for conditional requests (If-None-Match).
    location ~ ^/\.well-known/(?:about\.md|contact\.vcf|following\.opml)$ {
        types {
            text/markdown md;
            text/vcard vcf;
            text/x-opml opml;
        }
        charset utf-8;
        charset_types text/markdown text/vcard text/x-opml;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
        add_header Access-Control-Allow-Headers "*" always;
        add_header Access-Control-Expose-Headers "ETag" always;
        add_header Access-Control-Max-Age "86400" always;
        if ($request_method = OPTIONS) {
            return 204;
        }
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
