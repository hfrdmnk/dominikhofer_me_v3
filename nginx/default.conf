server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location = /rss.xml {
        types {}
        default_type application/xml;
        charset utf-8;
        charset_types application/xml;
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
