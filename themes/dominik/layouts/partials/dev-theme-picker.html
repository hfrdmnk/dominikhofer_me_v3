<div class="dev-theme-picker" data-dev-theme-picker role="group" aria-label="Development theme color">
  <button class="dev-theme-picker__swatch" type="button" data-theme-day="1" aria-label="Monday, red" aria-pressed="false"></button>
  <button class="dev-theme-picker__swatch" type="button" data-theme-day="2" aria-label="Tuesday, orange" aria-pressed="false"></button>
  <button class="dev-theme-picker__swatch" type="button" data-theme-day="3" aria-label="Wednesday, yellow" aria-pressed="false"></button>
  <button class="dev-theme-picker__swatch" type="button" data-theme-day="4" aria-label="Thursday, green" aria-pressed="false"></button>
  <button class="dev-theme-picker__swatch" type="button" data-theme-day="5" aria-label="Friday, teal" aria-pressed="false"></button>
  <button class="dev-theme-picker__swatch" type="button" data-theme-day="6" aria-label="Saturday, blue" aria-pressed="false"></button>
  <button class="dev-theme-picker__swatch" type="button" data-theme-day="0" aria-label="Sunday, violet" aria-pressed="false"></button>
  <button class="dev-theme-picker__reset" type="button" data-theme-reset>Reset</button>
</div>
