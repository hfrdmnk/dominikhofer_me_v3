{{- $page := . -}}
<div class="sidebar">
  <nav class="nav" aria-label="Primary">
    <a class="nav__home" href="{{ "/" | relURL }}">
      <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M10 6 4 12l6 6"/><path d="M4 12h16"/></svg>
      Back home
    </a>
    <ul class="nav__list">
      {{- range slice "/about" "/now" "/posts" "/hello" }}
      {{- $active := eq $page.RelPermalink (printf "%s/" .) }}
      <li><a href="{{ . | relURL }}"{{ if $active }} aria-current="page"{{ end }}>{{ . }}</a></li>
      {{- end }}
    </ul>
  </nav>
  <a class="progress" href="#top" aria-label="Back to top">
    <span class="progress__ring" aria-hidden="true">
      <svg viewBox="0 0 36 36">
        <circle class="progress__track" cx="18" cy="18" r="16"/>
        <circle class="progress__bar" cx="18" cy="18" r="16"/>
      </svg>
    </span>
    <span class="progress__label">
      <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20V4"/><path d="m6 10 6-6 6 6"/></svg>
      Back to top
    </span>
  </a>
</div>
