{{- range .Params.media }}
  {{- with $.Resources.Get . }}
    {{- if eq .MediaType.MainType "video" }}
<p><video src="{{ .RelPermalink }}" controls playsinline preload="metadata"></video></p>
    {{- else }}
<p>{{ partial "responsive-image.html" (dict
  "image" .
  "alt" ""
  "loading" "lazy"
  "decoding" "async"
) }}</p>
    {{- end }}
  {{- end }}
{{- end }}
