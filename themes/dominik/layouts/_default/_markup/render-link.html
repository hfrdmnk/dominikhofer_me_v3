{{- $destination := urls.Parse .Destination -}}
{{- $site := urls.Parse site.BaseURL -}}
{{- $external := and $destination.Host (ne $destination.Host $site.Host) -}}
<a href="{{ .Destination | safeURL }}"{{ with .Title }} title="{{ . }}"{{ end }}{{ if $external }} target="_blank" rel="noopener noreferrer"{{ end }}>{{ .Text | safeHTML }}</a>{{- "\u2060" | safeHTML -}}
