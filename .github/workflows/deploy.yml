name: Build and deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: "0 */2 * * *"

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

env:
  SEQUOIA_RUNTIME_DIR: ${{ github.workspace }}/.sequoia-runtime

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check required secrets
        env:
          ATP_APP_PASSWORD: ${{ secrets.ATP_APP_PASSWORD }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          FEDIFY_SYNC_TOKEN: ${{ secrets.FEDIFY_SYNC_TOKEN }}
        run: |
          for secret_name in \
            ATP_APP_PASSWORD \
            CLOUDFLARE_API_TOKEN \
            CLOUDFLARE_ACCOUNT_ID \
            FEDIFY_SYNC_TOKEN
          do
            if [ -z "${!secret_name:-}" ]; then
              echo "Missing GitHub Secret: $secret_name" >&2
              exit 1
            fi
          done

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.23.1
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Restore Sequoia publication state
        uses: actions/cache/restore@v5
        with:
          path: ${{ env.SEQUOIA_RUNTIME_DIR }}/.sequoia-state.json
          key: sequoia-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            sequoia-

      - name: Publish eligible posts
        env:
          ATP_IDENTIFIER: dominikhofer.me
          ATP_APP_PASSWORD: ${{ secrets.ATP_APP_PASSWORD }}
          PDS_URL: https://eurosky.social
        run: ./scripts/publish-sequoia.sh

      - name: Save Sequoia publication state
        uses: actions/cache/save@v5
        with:
          path: ${{ env.SEQUOIA_RUNTIME_DIR }}/.sequoia-state.json
          key: sequoia-${{ github.run_id }}-${{ github.run_attempt }}

      # Resized images, so that a build only encodes new ones.
      - name: Restore image cache
        uses: actions/cache@v5
        with:
          path: node_modules/.astro/assets
          key: astro-images-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            astro-images-

      - name: Build website
        run: npm run build

      - name: Deploy to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run deploy

      # After the deploy, because the first deploy creates the database.
      - name: Apply database migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run db:migrate

      - name: Announce new posts on the fediverse
        env:
          FEDIFY_SYNC_TOKEN: ${{ secrets.FEDIFY_SYNC_TOKEN }}
        run: |
          curl --fail-with-body --silent --show-error \
            --connect-timeout 10 --max-time 60 \
            --retry 3 --retry-all-errors --retry-delay 10 \
            --request POST \
            --header "Authorization: Bearer $FEDIFY_SYNC_TOKEN" \
            https://dominikhofer.me/ap/sync
