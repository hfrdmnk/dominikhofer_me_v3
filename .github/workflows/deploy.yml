name: Build and deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: "0 */2 * * *"

permissions:
  contents: read
  packages: write

concurrency:
  group: production-deploy
  cancel-in-progress: false

env:
  HUGO_VERSION: 0.164.0
  HUGO_CACHEDIR: ${{ github.workspace }}/.hugo-cache
  HUGO_ENVIRONMENT: production
  SEQUOIA_RUNTIME_DIR: ${{ github.workspace }}/.sequoia-runtime
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check required secrets
        env:
          ATP_APP_PASSWORD: ${{ secrets.ATP_APP_PASSWORD }}
          HUGO_LASTFM_API_KEY: ${{ secrets.HUGO_LASTFM_API_KEY }}
          DOKPLOY_WEBHOOK_URL: ${{ secrets.DOKPLOY_WEBHOOK_URL }}
        run: |
          for secret_name in \
            ATP_APP_PASSWORD \
            HUGO_LASTFM_API_KEY \
            DOKPLOY_WEBHOOK_URL
          do
            if [ -z "${!secret_name:-}" ]; then
              echo "Missing GitHub Secret: $secret_name" >&2
              exit 1
            fi
          done

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.23.1
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Hugo
        run: |
          curl --fail --silent --show-error --location \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_${HUGO_VERSION}_linux-amd64.tar.gz" \
            --output /tmp/hugo.tar.gz
          echo "d9c8b17285ea4ec004d9f814273ea910f2051ce02c284993fd1f91ba455ae50d  /tmp/hugo.tar.gz" \
            | sha256sum --check
          sudo tar --extract --gzip --file /tmp/hugo.tar.gz --directory /usr/local/bin hugo

      - name: Restore Hugo caches
        uses: actions/cache@v5
        with:
          path: |
            ${{ env.HUGO_CACHEDIR }}
            resources/_gen
          key: hugo-${{ runner.os }}-${{ env.HUGO_VERSION }}-${{ hashFiles('hugo.toml', 'package-lock.json', 'assets/**', 'themes/**') }}
          restore-keys: |
            hugo-${{ runner.os }}-${{ env.HUGO_VERSION }}-

      - name: Restore Sequoia publication state
        uses: actions/cache/restore@v5
        with:
          path: ${{ env.SEQUOIA_RUNTIME_DIR }}/.sequoia-state.json
          key: sequoia-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            sequoia-

      - name: Publish eligible posts
        env:
          ATP_IDENTIFIER: dominik.social
          ATP_APP_PASSWORD: ${{ secrets.ATP_APP_PASSWORD }}
          PDS_URL: https://eurosky.social
        run: ./scripts/publish-sequoia.sh

      - name: Save Sequoia publication state
        uses: actions/cache/save@v5
        with:
          path: ${{ env.SEQUOIA_RUNTIME_DIR }}/.sequoia-state.json
          key: sequoia-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Build website
        env:
          HUGO_LASTFM_API_KEY: ${{ secrets.HUGO_LASTFM_API_KEY }}
        run: ./scripts/build.sh --minify --cleanDestinationDir

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image metadata
        id: metadata
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,format=long

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify public image access
        run: |
          docker logout ghcr.io
          if ! docker buildx imagetools inspect "${IMAGE_NAME}:latest" >/dev/null; then
            echo "The GHCR package must be public before Dokploy can pull it without credentials." >&2
            exit 1
          fi

      - name: Trigger Dokploy
        env:
          DOKPLOY_WEBHOOK_URL: ${{ secrets.DOKPLOY_WEBHOOK_URL }}
        run: |
          payload=$(jq --null-input \
            --arg ref "$GITHUB_REF" \
            --arg repository "$GITHUB_REPOSITORY" \
            '{ref: $ref, repository: {full_name: $repository}}')
          curl --fail-with-body --silent --show-error \
            --retry 3 --retry-all-errors \
            --request POST \
            --header "Content-Type: application/json" \
            --header "X-GitHub-Event: push" \
            --data "$payload" \
            "$DOKPLOY_WEBHOOK_URL"
